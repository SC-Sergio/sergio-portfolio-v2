name: Dependency audit fix

on:
  push:
    branches:
      - portfolio-polish-v1
    paths:
      - .github/workflows/dependency-audit-fix.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Verify dependency audit
        run: npm audit

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No audit lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh transitive dependency fixes"
          git push origin HEAD:portfolio-polish-v1
