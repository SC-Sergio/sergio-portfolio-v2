name: Dependency refresh preview

on:
  push:
    branches:
      - portfolio-polish-v1
    paths:
      - .github/workflows/dependency-refresh-preview.yml

permissions:
  contents: write

jobs:
  refresh-next:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh patched Next.js manifests
        run: npm install --package-lock-only --save-exact next@16.3.3 eslint-config-next@16.3.3

      - name: Verify no critical npm advisories remain
        run: npm audit --audit-level=critical

      - name: Commit refreshed manifests to the polish branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes to commit."
            exit 0
          fi
          git commit -m "chore: patch Next.js dependencies"
          git push origin HEAD:portfolio-polish-v1
