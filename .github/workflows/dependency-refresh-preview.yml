name: Dependency refresh preview

on:
  push:
    branches:
      - portfolio-polish-v1
    paths:
      - .github/workflows/dependency-refresh-preview.yml

permissions:
  contents: read

jobs:
  refresh-next:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh patched Next.js manifests
        run: npm install --package-lock-only --save-exact next@16.3.3 eslint-config-next@16.3.3

      - name: Verify no critical npm advisories remain
        run: npm audit --audit-level=critical

      - name: Upload refreshed manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patched-next-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
